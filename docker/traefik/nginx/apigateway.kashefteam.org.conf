# ─────────────────────────────────────────────────────────────────────
#  gateway.kashefteam.org  →  Traefik API Gateway
# ─────────────────────────────────────────────────────────────────────
#  nginx stays the TLS edge for the whole host; this block forwards the
#  single public gateway host to Traefik, which performs all internal
#  path routing (FastAPI API, tile server, external microservices).
#
#  The wildcard *.kashefteam.org certificate already covers this host,
#  so no new certificate has to be issued — no ACME/CDNS challenge and
#  no downtime for the other sites on this server.
#
#  Install:
#      sudo cp docker/traefik/nginx/gateway.kashefteam.org.conf \
#              /etc/nginx/sites-available/gateway.kashefteam.org
#      sudo ln -s /etc/nginx/sites-available/gateway.kashefteam.org \
#                 /etc/nginx/sites-enabled/gateway.kashefteam.org
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Requires: gateway.kashefteam.org DNS record pointing at this host.
# ─────────────────────────────────────────────────────────────────────

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gateway.kashefteam.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.kashefteam.org;

    ssl_certificate     /etc/ssl/kashefteamcerts/fullchain.pem;
    ssl_certificate_key /etc/ssl/kashefteamcerts/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Edge security headers. Traefik deliberately does NOT set these too,
    # to avoid duplicate/conflicting headers on the same response.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Everything goes to the gateway ───────────────────────────────
    location / {
        # Traefik, published on loopback by docker-compose.yml
        # (TRAEFIK_HTTP_PORT, default 8090).
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket / SSE passthrough
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Off keeps streaming responses (tiles, SSE, long queries)
        # flowing instead of being buffered whole. Turn on with
        # proxy_buffers if you prefer throughput over latency.
        proxy_buffering off;
    }

    access_log /var/log/nginx/gateway_access.log;
    error_log  /var/log/nginx/gateway_error.log;
}
