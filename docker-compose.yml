# docker-compose.yml  ← your project root

version: '3.9'

services:

  # ── Traefik — API Gateway ──────────────────────────────────────
  # The frontend only ever talks to https://${DOMAIN}, which nginx
  # terminates TLS for and forwards to Traefik on 127.0.0.1:8090.
  # Traefik fans the request out to the API, the tile server and the
  # external microservices. Nothing here is exposed to the internet.
  traefik:
    image: traefik:v3.4
    container_name: map_traefik
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_started
    ports:
      # Loopback only — reached exclusively through the host's nginx.
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-8090}:80"
      - "127.0.0.1:${TRAEFIK_API_PORT:-8080}:8080"   # dashboard + /metrics
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - map_net
      - socket_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Docker socket proxy ────────────────────────────────────────
  # Lets Traefik read the Docker API without mounting the raw socket
  # into the gateway. Only the endpoints the Docker provider needs are
  # enabled; everything else is denied. It sits on its own internal
  # network so no other container can reach the Docker API.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: map_docker_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      VERSION: 1
      EVENTS: 1
      PING: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net

  postgres:
    image: postgis/postgis:16-3.4
    container_name: map_postgres
    restart: unless-stopped
    env_file: .env
    networks:
      - map_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
        -c max_connections=2000
        -c shared_buffers=10GB
        -c effective_cache_size=30GB
        -c work_mem=256MB
        -c maintenance_work_mem=4GB
        -c max_parallel_workers=24
        -c max_parallel_workers_per_gather=8
        -c max_worker_processes=32
        -c parallel_tuple_cost=0.01
        -c parallel_setup_cost=100
        -c effective_io_concurrency=300
        -c random_page_cost=1.1
        -c wal_buffers=256MB
        -c checkpoint_completion_target=0.9
        -c max_wal_size=8GB
        -c huge_pages=try
        -c jit=off
        -c default_statistics_target=500
        -c log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: map_redis
    restart: unless-stopped
    networks:
      - map_net
    volumes:
      - redis_data:/data
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:2.9.4
    container_name: map_loki
    restart: unless-stopped
    networks:
      - map_net
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Tempo ──────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.8.2
    container_name: map_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - map_net
    ports:
      - "3200:3200"   # HTTP (Grafana queries here)
      - "4317:4317"   # OTLP gRPC  (API sends here)
      - "4318:4318"   # OTLP HTTP  (fallback)
    extra_hosts:
      # So Tempo can remote_write to Prometheus in other compose
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 20s

  # ── Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: map_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: "grafana.kashefteam.org"
      GF_SERVER_ROOT_URL: "https://grafana.kashefteam.org/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # ── Enable Tempo metrics generator integration ──────────────
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceQLStreaming metricsSummary"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - map_net
    ports:
      - "127.0.0.1:3002:3000"
    extra_hosts:
      # So Grafana can reach Prometheus in other compose
      - "host.docker.internal:host-gateway"
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── API ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: map_api
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOKI_URL: http://loki:3100
      # ── Tracing ─────────────────────────────────────────────────
      OTEL_SERVICE_NAME: map-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      # ── Propagation (for distributed tracing across services) ───
      OTEL_PROPAGATORS: tracecontext,baggage
      # ── Sampling (1.0 = 100%, lower in prod if needed) ──────────
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    ports:
      - "127.0.0.1:8001:8000"   # local debugging only — public access is via Traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "map_net"

      # ── The public API route (the frontend's single origin) ──────
      traefik.http.routers.api.rule: "Host(`${DOMAIN:-gateway.kashefteam.org}`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`))"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.middlewares: "rate-limit@file,in-flight@file,body-limit@file"

      traefik.http.services.api.loadbalancer.server.port: "8000"
      traefik.http.services.api.loadbalancer.healthcheck.path: "/health"
      traefik.http.services.api.loadbalancer.healthcheck.interval: "15s"
      traefik.http.services.api.loadbalancer.healthcheck.timeout: "5s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - map_net
    volumes:
      - ./:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4

  martin:
    image: ghcr.io/maplibre/martin
    container_name: map_martin
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./docker/martin/config.yaml:/config.yaml
    ports:
      - "127.0.0.1:3001:3000"   # local debugging only — public access is via Traefik
    networks:
      - map_net
    labels:
      traefik.enable: "true"
      traefik.docker.network: "map_net"

      # ── Tiles + catalog, under /tiles (prefix stripped) ──────────
      traefik.http.routers.tiles.rule: "Host(`${DOMAIN:-gateway.kashefteam.org}`) && PathPrefix(`/tiles`)"
      traefik.http.routers.tiles.entrypoints: "web"
      # retry is safe here: tile requests are read-only GETs.
      traefik.http.routers.tiles.middlewares: "strip-tiles@file,rate-limit@file,compress@file,retry@file"

      traefik.http.services.tiles.loadbalancer.server.port: "3000"
      traefik.http.services.tiles.loadbalancer.healthcheck.path: "/health"
      traefik.http.services.tiles.loadbalancer.healthcheck.interval: "15s"
      traefik.http.services.tiles.loadbalancer.healthcheck.timeout: "5s"
    command: --config /config.yaml
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
  tempo_data:

networks:
  # One shared bridge network: every service plus the gateway (Traefik
  # also discovers containers on it through the Docker provider).
  map_net:
    # Fixed name AND subnet: Traefik's static config references the name
    # literally (providers.docker.network) and trusts the bridge gateway
    # IP (10.211.0.1) for forwarded headers, so both must be stable and
    # outside Docker's default 172.17-172.31 pool to avoid collisions.
    name: map_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.211.0.0/24
  # Internal-only network for the Docker API proxy. Only Traefik and the
  # proxy are attached, so no application container can reach Docker.
  socket_net:
    name: socket_net
    driver: bridge
    internal: true

